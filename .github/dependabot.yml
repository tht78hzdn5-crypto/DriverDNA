# Dependency updates, weekly. No reviewers or assignees: solo repo, and
# every Dependabot PR goes through the same merge gates as any other PR
# (the ruleset's required checks apply to Dependabot PRs too).
version: 2
updates:
  # Python uses the `uv` ecosystem, not `pip`: Dependabot's pip updater does
  # not understand uv.lock, while the `uv` ecosystem updates the lockfile
  # itself (GitHub's Dependabot options reference lists `uv` as supported).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
