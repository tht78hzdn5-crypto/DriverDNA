name: Tests

# The merge gate. More than one agent works on this repository (see AGENTS.md),
# and every invariant this project has — determinism, the source contract,
# reference-lap isolation, the grounding validator — is enforced by pytest;
# `ruff check` (correctness rules only, no formatter — SPEC.md A47) catches
# what pytest structurally can't. So the suite runs on every proposed change,
# not just when someone remembers.
#
# `push:` is scoped to `main` deliberately (BUG-039). It used to be unscoped,
# which meant a push to a branch with an open PR matched BOTH triggers and ran
# the entire suite twice against the identical commit — ten of thirty sampled
# runs were exact duplicates, at ~19 billed minutes each. Coverage is unchanged:
# AGENTS.md requires every change to reach `main` through a PR, so
# `pull_request` already gates everything that can land. The one behaviour
# change worth knowing: a branch with no open PR gets no CI, so open the PR
# (draft is fine) to get the gates running.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run when new commits land on the same ref. Without
# this, pushing three times in quick succession queued three full runs and let
# the two stale ones burn to completion (BUG-039).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      # The dual-backend tests only activate when DRIVERDNA_TEST_DATABASE_URL
      # points at a local instance (tests/conftest.py refuses a remote host,
      # since each test DROPs its schema CASCADE). Without this service they
      # would silently skip, and a change to db.py/sql.py/store.py could break
      # the Postgres backend with every SQLite test still green.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: driverdna
          POSTGRES_PASSWORD: driverdna
          POSTGRES_DB: driverdna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driverdna -d driverdna_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          DRIVERDNA_TEST_DATABASE_URL: postgresql://driverdna:driverdna@localhost:5432/driverdna_test
        # Chromium is not installed in this job, so browser tests are
        # explicitly deselected by marker (`-m "not browser"`) rather than
        # left to skip on their own missing-Chromium guard — the two used to
        # be equivalent, but relying on the guard is what let this job report
        # green while every browser test silently skipped. They run for real
        # in the separate `browser-tests` job, which now blocks merges.
        #
        # No extra -q: pyproject's addopts already sets it, and -qq suppresses
        # the "N passed, M skipped" summary line — which is the one line you
        # actually read off a gate. -rs lists skip reasons for the same reason.
        #
        # `set -o pipefail` is load-bearing: the runner's default shell is
        # `bash -e`, without pipefail, so `pytest | tee` would exit with tee's
        # status and a failing suite would report green.
        run: |
          set -o pipefail
          python -m pytest -rs -m "not browser" | tee pytest-output.txt

      # A green run is not proof the Postgres backend was exercised: if the
      # service container never came up, every dual-backend test would skip and
      # the job would still pass. That is precisely the silent-coverage-loss
      # this container exists to prevent, so assert it did not happen.
      - name: Confirm the Postgres backend actually ran
        run: |
          if grep -q "no local Postgres configured" pytest-output.txt; then
            echo "::error::Postgres-gated tests SKIPPED — the service container"
            echo "::error::was not reachable, so A23's dual-backend guards"
            echo "::error::(COLLATE \"C\", DOUBLE PRECISION, RLS) did not run."
            grep -c "no local Postgres configured" pytest-output.txt
            exit 1
          fi
          echo "Postgres backend exercised: no backend-configuration skips."

      # Beck-style "AI cheating" detector (TDD guardrail, 2026-07-27).
      # If a push modifies files under tests/ but touches nothing under
      # src/driverdna/ (the source package), that is suspicious: it may mean
      # an agent modified tests to fit broken code instead of fixing the code.
      # This is a WARNING, not a failure — legitimate test-only commits
      # (refactoring helpers, adding coverage) are allowed but flagged.
      - name: Warn if tests changed without source changes
        if: github.event_name == 'push'
        run: |
          # Compare this push's commits against the parent (fetch-depth: 2).
          changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null) || true
          if [ -z "$changed_files" ]; then
            echo "Could not determine changed files (shallow clone?). Skipping TDD guardrail check."
            exit 0
          fi
          test_changes=$(echo "$changed_files" | grep -c '^tests/' || true)
          src_changes=$(echo "$changed_files" | grep -c '^src/driverdna/' || true)

          if [ "$test_changes" -gt 0 ] && [ "$src_changes" -eq 0 ]; then
            echo "::warning::TDD guardrail: this push modifies $test_changes test file(s) but zero source files under src/driverdna/. If an agent changed tests to fit broken code instead of fixing the code, that violates the Red→Green→Refactor contract (AGENTS.md)."
          fi

  # Correctness-only lint: ruff (pyflakes + bugbear) for the engine, eslint
  # (pyflakes-equivalent rules only — no style/formatting) for the SPA. No
  # formatter, no line-length rule — SPEC.md A47 records why: a repo three
  # agents push directly to, with committed Vite build output and a test
  # suite that asserts on Python source text
  # (tests/test_ordering_determinism.py's inspect.getsource checks), is a
  # bad target for a reflow tool. Config lives in pyproject.toml's
  # [tool.ruff] and ui/eslint.config.js so both behave identically here and
  # on a contributor's machine.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check --output-format=github .

      - name: Install SPA dependencies
        working-directory: ui
        run: npm ci

      - name: eslint
        working-directory: ui
        run: npm run lint

  # Mechanises the AGENTS.md non-negotiable that secrets (GARAGE61_TOKEN,
  # ANTHROPIC_API_KEY, GEMINI_API_KEY, DRIVERDNA_DATABASE_URL) are env-only
  # and never persisted — previously trusted to review alone. The pinned
  # binary is downloaded directly (not gitleaks-action), matching how this
  # repo already pins google-github-actions/run-gemini-cli in
  # gemini-assistant.yml: no third-party Action's own supply chain to trust,
  # and the version/checksum pin is enforced by
  # test_agent_contract.py::test_gitleaks_version_is_pinned_and_checksummed,
  # the same convention as that action's own pin test.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — a leak in an old commit still counts

      - name: Install gitleaks (pinned + checksummed)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: gitleaks detect
        run: gitleaks detect --no-banner --redact --exit-code 1

  # mypy, advisory (SPEC.md A47) — NOT continue-on-error, deliberately.
  # continue-on-error is exactly what let the browser-tests job sit red and
  # unread for an unknown stretch of history (see that job's comment
  # below); the same mistake here would be pointless self-sabotage right
  # after fixing it there. Advisory instead comes from Phase 6/branch
  # protection simply never adding "mypy" to the required-checks list —
  # the job is still allowed to fail for real, visibly, it just can't block
  # a merge.
  #
  # 59 pre-existing findings (spot-checked, not real bugs: dynamic
  # attributes on a class built via object.__new__ bypassing __init__,
  # Optional-narrowing on loosely-typed dicts, an exception-named loop
  # variable mypy's scope check flags on principle) are pinned in
  # ci/mypy-baseline.txt rather than fixed outright — cleaning up 59
  # findings is a different, larger task than adding a gate. The gate
  # itself is a ratchet: it never demands the baseline improve, but it
  # fails the moment a push adds a new finding on top of it, so a real type
  # error can't slip in silently just because the count was never zero.
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: mypy (ratchet against ci/mypy-baseline.txt)
        run: |
          python -m mypy src/driverdna | tee mypy-output.txt
          mypy_exit=${PIPESTATUS[0]}
          if [ "$mypy_exit" -gt 1 ]; then
            echo "::error::mypy exited $mypy_exit (a fatal/config error, not a normal type-error report) — see the log above."
            exit 1
          fi
          count=$(grep -oE '^Found [0-9]+ error' mypy-output.txt | grep -oE '[0-9]+' || echo 0)
          baseline=$(cat ci/mypy-baseline.txt)
          echo "mypy findings: $count (baseline: $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::mypy findings ($count) exceed ci/mypy-baseline.txt's pinned count ($baseline) — a new type error was introduced. Fix it, or if it's a false positive, update the baseline with a one-line explanation in the commit message."
            exit 1
          elif [ "$count" -lt "$baseline" ]; then
            echo "::notice::mypy findings ($count) are below the baseline ($baseline). Update ci/mypy-baseline.txt to lock the improvement in, or the ratchet won't catch a regression back up to the old count."
          fi

  # Browser trust gates — the Chromium-gated tests that the main pytest job
  # deliberately deselects. A required, blocking check (2026 CI hardening):
  # this job used to be `continue-on-error: true`, which is exactly what let
  # every browser test silently skip here for an unknown stretch of history
  # (Playwright's own installer moved to a `chrome-linux64/` layout; the
  # tests' Chromium-discovery glob still looked for the old `chrome-linux/`,
  # so every run hit the "not present" skip guard and reported green anyway
  # because the job's failure didn't count). tests/browser.py now asks
  # Playwright for its own browser path instead of guessing the layout, and
  # this job blocks for real.
  #
  # Single Python version (3.12) — browser tests exercise UI rendering and
  # FastAPI routing, not Python-version compatibility. No Postgres — every
  # browser test uses SQLite fixture DBs.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium via Playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: python -m playwright install chromium --with-deps

      - name: Build SPA
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Confirm SPA built
        run: |
          if [ ! -f src/driverdna/ui/static/index.html ]; then
            echo "::error::SPA build did not produce src/driverdna/ui/static/index.html"
            exit 1
          fi
          echo "SPA built: $(find src/driverdna/ui/static -type f | wc -l) files"

      - name: Browser tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        # Selected by marker (`-m browser`), not a hand-maintained file list —
        # a new browser test module is picked up automatically instead of
        # silently running nowhere (tests/test_reference_curation_ui.py did,
        # until this change: Chromium-gated so it skipped in the main job,
        # and absent from this job's old file list). If the marker itself
        # ever typos, pytest exits 5 (no tests collected) and this step fails
        # under `set -o pipefail` — no silent empty run either.
        run: |
          set -o pipefail
          python -m pytest -rs -m browser | tee browser-test-output.txt

      - name: Confirm browser tests actually ran
        run: |
          if grep -q "Chromium binary or built SPA not present" browser-test-output.txt; then
            echo "::error::Browser tests SKIPPED despite Chromium install — the"
            echo "::error::skip guard still triggered. Check PLAYWRIGHT_BROWSERS_PATH"
            echo "::error::and the SPA build output."
            exit 1
          fi
          echo "Browser tests exercised: no Chromium/SPA-absent skips."
