# Secret-scanning config (SPEC.md A47). Extends gitleaks' built-in default
# ruleset rather than redefining it, so a gitleaks upgrade picks up new
# detection rules automatically.
#
# Paths allowlisted, not because a leak was found there (a full-history scan
# with the default ruleset found none — 116 commits, ~45.6 MB, verified
# before this config was written), but because both hold content that could
# plausibly trip an entropy-based rule as they grow: real 60 Hz telemetry
# CSVs (tests/fixtures/) and hashed/minified Vite build output
# (src/driverdna/ui/static/), neither of which is source this scan is
# meant to cover.
#
# Regex allowlisted because a leak WAS found there and it is a false
# positive (BUG-051): gitleaks' generic-api-key rule flags the
# CoachingConfig field name `exit_accel_floor_ms2` (used as
# `floor_key="exit_accel_floor_ms2"` in src/driverdna/coaching/ontology.py)
# — a config-key name, not a credential, whose entropy crosses the rule's
# threshold while every other floor_key value in the same file does not.
# Allowlist regexes match against the flagged secret value, so the regex
# names that exact value: it exempts this config-key name wherever it
# appears as a finding, and nothing else.
[extend]
useDefault = true

[allowlist]
paths = [
  '''tests/fixtures/.*''',
  '''src/driverdna/ui/static/.*''',
]
regexes = [
  '''exit_accel_floor_ms2''',
]
