# Persistent journal storage for the driverdna unit.
#
# Without this, journald defaults to volatile storage on most distributions
# (Oracle Linux, Ubuntu minimal) — logs vanish on reboot, and a crash-loop
# or a refused start leaves no trace to diagnose (BUG-018's root cause was
# lost exactly this way).
#
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-driverdna.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# This makes ALL units persistent (journald has no per-unit storage config).
# SystemMaxUse caps the total disk footprint; the vacuum keeps the oldest
# entries from filling the block volume.

[Journal]
Storage=persistent
SystemMaxUse=200M
