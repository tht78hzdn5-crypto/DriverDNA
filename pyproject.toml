[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driverdna"
version = "0.1.0.dev0"
description = "Personal racing-telemetry instrument: deterministic technique analysis over Garage61 exports, with grounded AI coaching"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "typer>=0.9",
]

[project.optional-dependencies]
# python-multipart: FastAPI's Form()/File()/UploadFile support (the laps
# upload endpoint) requires it at runtime; a clean install-time dependency,
# not a vendored parser.
ui = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9",
      "cryptography>=42"]
# pg: the hosted-Postgres backend. Optional on purpose — SQLite remains a
# first-class backend, so a local-only install needs no database driver and
# `pip install -e .` is unchanged.
pg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
# ai-claude / ai-gemini (DEPLOY-SPEC Track P item 7): neither provider SDK
# is needed to run the engine, and the engine is the product. Both classes
# in coach/provider.py and chat/session.py lazy-import their own SDK inside
# __init__, so a driver running only the other provider (or neither) never
# needs to install this. `anthropic` was a hard dependency before this
# split; nothing at module level in this codebase imports it eagerly, so
# removing it from `dependencies` is additive, not a behavior change for an
# existing install that already has it.
ai-claude = ["anthropic>=0.40"]
ai-gemini = ["google-genai>=1.0"]
# playwright is optional: the render-parity test skips if it or Chromium is
# absent. httpx ships with fastapi's test client. psycopg is here so the
# dual-backend tests can run; they skip when no local Postgres is configured.
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27",
       "playwright>=1.40", "python-multipart>=0.0.9",
       "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "cryptography>=42",
       "anthropic>=0.40", "google-genai>=1.0", "ruff>=0.15", "mypy>=1.11"]

[project.scripts]
driverdna = "driverdna.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driverdna = ["ui/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "browser: needs a real Chromium via Playwright and the built SPA",
]

[tool.ruff]
target-version = "py311"
# Committed Vite build output (hashed bundles) and real telemetry fixtures —
# neither is source this project's style rules apply to.
extend-exclude = ["src/driverdna/ui/static", "tests/fixtures"]

[tool.ruff.lint]
# Correctness only (pyflakes + bugbear): no formatter, no line-length rule.
# A repo three agents push directly to, with a committed-build-output and
# inspect.getsource-asserting test suite, is a bad target for a reflow tool —
# see docs/SPEC.md A46.
select = ["F", "E4", "E7", "E9", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/typer resolve these at call time via Depends()/File()/Form()/
# Option() themselves; they are not the "mutable default argument" bug B008
# exists to catch.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
    "typer.Option", "typer.Argument",
]

[tool.mypy]
# 3.12, matching the interpreter the `mypy` CI job actually runs (not 3.11,
# the project's floor — pinning below the running interpreter broke the
# gate for real: pip resolves numpy>=2.5 on 3.12, whose shipped stub uses
# PEP 695 `type` syntax that only parses under a 3.12+ target, and mypy
# treats an unparseable stub as fatal, not a normal error to report. Costs
# nothing: the codebase has no version-gated syntax between 3.11/3.12 (no
# match statements, `from __future__ import annotations` throughout), and
# runtime 3.11 compatibility is still verified for real by pytest's own
# 3.11/3.12 matrix — mypy's target version was never that check.
python_version = "3.12"
ignore_missing_imports = true
files = ["src/driverdna"]
